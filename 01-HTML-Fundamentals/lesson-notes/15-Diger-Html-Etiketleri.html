<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diğer HTML Etiketleri Hakkında #15</title>
</head>
<body>
    
    <h3>Form etiketi</h3>
<form method="post" action="https://formtester.goodbytes.be/post.php">
<label for="name">Adınız</label>
<input type="text" id="name" name="firstname">
<br>
<label for="username">Kullanıcı Adınız:</label>
<input type="text" id="username" name="username">
<br>
<br>
<button type="submit">Gönder</button>
</form>
    <h3>Password</h3>
<form method="post" action="https://formtester.goodbytes.be/post.php">
<label for="username">Kullanıcı Adınız</label>
<input type="text" id="username" name="username">
<br>
<label for="password">Parolanız</label>
<input type="password" id="password" name="password">
<br>
<br>
<button type="submit">Gönder</button>
</form>
    <h3>e-mail</h3>
<form method="post" action="https://formtester.goodbytes.be/post.php">
<label for="email">E-posta</label>
<input type="email" id="emal" name="email">
<br>
<label for="password">Parolanız</label>
<input type="password" id="password" name="password">
<br>
<br>
<button type="submit">Gönder</button>
</form>
    <h3>Cinsiyet</h3>
<form method="post" action="https://formtester.goodbytes.be/post.php">
<label for="male">Erkek</label>
<input type="radio" id="male" name="gender" value="male">
<br>
<label for="female">Kadın</label>
<input type="radio" id="female" name="gender" value="female">
<br>
<br>
<button type="submit">Gönder</button>
</form>
    <h3>Iletişim Tercihiniz</h3>
<form method="post" action="https://formtester.goodbytes.be/post.php">
<label for="sms">SMS</label>
<input type="radio" id="sms" name="contact" value="sms">
<br>
<label for="phone">Telefon</label>
<input type="radio" id="phone" name="contact" value="phone">
<br>
<label for="email">Eposta</label>
<input type="radio" id="email" name="contact" value="email">
<br>
<button type="submit">Gönder</button>
</form>
</form>
    <h3>Birden Fazla Iletişim Tercihiniz</h3>
<form method="post" action="https://formtester.goodbytes.be/post.php">
<label for="sms">SMS</label>
<input type="checkbox" id="sms" name="contact" value="sms">
<br>
<label for="phone">Telefon</label>
<input type="checkbox" id="phone" name="contact" value="phone">
<br>
<label for="email">Eposta</label>
<input type="checkbox" id="email" name="contact" value="email">
<br>
<button type="submit">Gönder</button>
</form>
    <h3>Select</h3>
<form method="post" action="https://formtester.goodbytes.be/post.php">
<label for="city">Şehir seçiniz</label>
<select name="city" id="city">
    <option value="34">Istanbul</option>
    <option value="35">Izmir</option>
    <option value="06">Ankara</option>
</select>
<br>
<button type="submit">Gönder</button>
</form>
    <h3>Textarea</h3>
<form method="post" action="https://formtester.goodbytes.be/post.php">
<label for="message">Mesaj metni giriniz</label>
<textarea name="message" id="message" rows="4" cols="5">

</textarea>
<br>
<button type="submit">Gönder</button>
</form>
    <h3>Date</h3>
<form method="post" action="https://formtester.goodbytes.be/post.php">
<label for="birthdate">Doğum tarihiniz</label>
<input type="date" id="birthdate" name="birthdate">
<br>
<button type="submit">Gönder</button>
</form>
    <h3>Kullanıcı Kayıt Formu</h3>
<form method="post" action="https://formtester.goodbytes.be/post.php">
<label for="name">Adınız:</label>
<input type="text" name="name" id="name" required>
<br>
<label for="email">Email</label>
<input type="email" name="email" id="email">
<br>
<label for="password">Şifreniz:</label>
<input type="password" name="password" id="password">
<br>
<label for="gender">Cinsiyet</label>
<select name="gender" id="gender">
    <option value="male">Erkek</option>
    <option value="female">Kadın</option>
</select>
<br>
<button type="submit">Kayıt ol</button>
</form>

</body>
</html>
